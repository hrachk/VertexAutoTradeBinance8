<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Vertex TWA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e1117);
      --card: var(--tg-theme-secondary-bg-color, #161b22);
      --text: var(--tg-theme-text-color, #e6edf3);
      --hint: var(--tg-theme-hint-color, #8b949e);
      --btn: var(--tg-theme-button-color, #238636);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --danger: #f85149;
      --ok: #3fb950;
      --warn: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 88px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--hint); font-size: 12px; margin-bottom: 12px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric .l { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .04em; }
    .metric .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px;
      border-radius: 999px; background: rgba(255,255,255,.06);
    }
    .pill.ok { color: var(--ok); }
    .pill.bad { color: var(--danger); }
    .pill.warn { color: var(--warn); }
    .pos { margin-bottom: 8px; }
    .pos .sym { font-weight: 700; }
    .pnl-pos { color: var(--ok); }
    .pnl-neg { color: var(--danger); }
    button {
      border: 0; border-radius: 10px; padding: 12px 14px; font-weight: 600; font-size: 14px;
      width: 100%; cursor: pointer;
    }
    .btn-primary { background: var(--btn); color: var(--btn-text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: rgba(255,255,255,.08); color: var(--text); }
    .btn-sm { padding: 8px 10px; font-size: 12px; width: auto; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    #toast {
      position: fixed; left: 12px; right: 12px; bottom: 16px; padding: 10px 12px;
      background: #1f6feb; color: #fff; border-radius: 10px; font-size: 13px;
      display: none; z-index: 99; text-align: center;
    }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <h1>Vertex AutoTrade</h1>
      <div class="sub" id="clock">—</div>
    </div>
    <div id="statusPills"></div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="metric"><div class="l">Equity</div><div class="v" id="equity">—</div></div>
      <div class="metric"><div class="l">Day PnL</div><div class="v" id="dayPnl">—</div></div>
      <div class="metric"><div class="l">Open</div><div class="v" id="openN">—</div></div>
      <div class="metric"><div class="l">WinRate / PF</div><div class="v" id="wrpf">—</div></div>
    </div>
    <div class="sub" style="margin:8px 0 0" id="dbLine">SQLite —</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <strong>Positions</strong>
      <span class="sub" id="posCount"></span>
    </div>
    <div id="positions"><div class="sub">Loading…</div></div>
  </div>

  <div class="card stack">
    <strong>Controls</strong>
    <div class="actions">
      <button class="btn-ghost" id="btnPause">Pause 30m</button>
      <button class="btn-ghost" id="btnResume">Resume</button>
    </div>
    <button class="btn-danger" id="btnKill">FLATTEN ALL / KILL</button>
  </div>

  <div id="toast"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('secondary_bg_color'); } catch (_) {}
    }

    const $ = (id) => document.getElementById(id);
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2500);
    }
    function fmt(n, d=2) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
    }
    function pnlClass(v) { return v >= 0 ? 'pnl-pos' : 'pnl-neg'; }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function refresh() {
      try {
        const [sum, pos, stats] = await Promise.all([
          api('/api/twa/summary'),
          api('/api/twa/positions'),
          api('/api/twa/stats')
        ]);
        $('equity').textContent = '$' + fmt(sum.equity ?? sum.Equity);
        const day = sum.dayPnl ?? sum.DayPnl ?? 0;
        const dayPct = sum.dayPnlPct ?? sum.DayPnlPct ?? 0;
        const dayEl = $('dayPnl');
        dayEl.textContent = (day >= 0 ? '+' : '') + fmt(day) + ' (' + fmt(dayPct, 1) + '%)';
        dayEl.className = 'v ' + pnlClass(day);
        $('openN').textContent = sum.openPositions ?? sum.OpenPositions ?? 0;
        const wr = ((stats.winRate ?? stats.WinRate) || 0) * 100;
        const pf = stats.profitFactor ?? stats.ProfitFactor ?? 0;
        $('wrpf').textContent = fmt(wr, 0) + '% / ' + fmt(pf);
        $('dbLine').textContent = 'SQLite ' + fmt(stats.sqliteMb ?? stats.SqliteMb, 2) + ' MB · ' +
          (stats.sqliteIntegrity ?? stats.SqliteIntegrity ?? '') +
          ' · trades today ' + (stats.tradesToday ?? stats.TradesToday ?? 0);

        const pills = [];
        const kill = sum.killSwitch ?? sum.KillSwitch;
        const btc = sum.btcVolLock ?? sum.BtcVolLock;
        pills.push('<span class="pill ' + (kill ? 'bad' : 'ok') + '">' + (kill ? '🔴 KILL' : '🟢 Run') + '</span>');
        pills.push('<span class="pill ' + (btc ? 'bad' : 'ok') + '">' + (btc ? '🔴 BTC Lock' : '🟢 BTC') + '</span>');
        pills.push('<span class="pill">' + (sum.binanceStatus ?? sum.BinanceStatus ?? '') + '</span>');
        $('statusPills').innerHTML = pills.join(' ');
        $('clock').textContent = (sum.mode ?? sum.Mode ?? '') + ' · ' + new Date().toLocaleTimeString();

        const list = pos || [];
        $('posCount').textContent = list.length + ' open';
        if (!list.length) {
          $('positions').innerHTML = '<div class="sub">No open positions</div>';
        } else {
          $('positions').innerHTML = list.map(p => {
            const sym = p.symbol || p.Symbol;
            const side = p.side || p.Side;
            const un = p.unPnl ?? p.UnPnl ?? 0;
            const entry = p.entry ?? p.Entry;
            const mark = p.mark ?? p.Mark;
            const lev = p.leverage ?? p.Leverage;
            return '<div class="card pos" style="margin:0 0 8px;padding:10px">' +
              '<div class="row"><span class="sym">' + sym + ' · ' + side + '</span>' +
              '<span class="' + pnlClass(un) + '">' + (un>=0?'+':'') + fmt(un) + '</span></div>' +
              '<div class="sub">E ' + fmt(entry, 4) + ' · M ' + fmt(mark, 4) + ' · ' + lev + 'x</div>' +
              '<div style="margin-top:6px"><button class="btn-sm btn-ghost" data-close="' + sym + '">Close</button></div></div>';
          }).join('');
          document.querySelectorAll('[data-close]').forEach(btn => {
            btn.onclick = async () => {
              const sym = btn.getAttribute('data-close');
              try {
                await api('/api/twa/close?symbol=' + encodeURIComponent(sym), { method: 'POST' });
                toast('Closed ' + sym);
                refresh();
              } catch (e) { toast('Close failed'); }
            };
          });
        }
      } catch (e) {
        $('clock').textContent = 'API error — check tunnel / Web host';
        console.error(e);
      }
    }

    $('btnPause').onclick = async () => {
      try { await api('/api/twa/pause?minutes=30', { method: 'POST' }); toast('Paused 30m'); refresh(); }
      catch { toast('Pause failed'); }
    };
    $('btnResume').onclick = async () => {
      try { await api('/api/twa/resume', { method: 'POST' }); toast('Resumed'); refresh(); }
      catch { toast('Resume failed'); }
    };
    $('btnKill').onclick = async () => {
      const ok = confirm('FLATTEN ALL / KILL — close all positions and block entries?');
      if (!ok) return;
      if (tg && tg.showConfirm) {
        // already confirmed via confirm()
      }
      try {
        await api('/api/twa/kill', { method: 'POST' });
        toast('KILL sent');
        if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('error'); } catch(_){}
        refresh();
      } catch { toast('KILL failed'); }
    };

    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
